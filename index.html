  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:#050e24;overflow:hidden;}
    .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 55% at 15% 0%,#1a4db5 0%,transparent 65%),radial-gradient(ellipse 55% 60% at 85% 95%,#0d2f80 0%,transparent 65%),#050e24;}

    .orb1{width:380px;height:380px;background:#1565c0;top:-120px;left:-100px;animation-duration:16s;}

    @keyframes drift{from{transform:translate(0,0);}to{transform:translate(30px,20px);}}
    .grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
    .card{position:relative;z-index:1;width:92%;max-width:380px;padding:42px 32px 38px;border-radius:28px;background:rgba(255,255,255,.06);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.14);box-shadow:0 2px 0 rgba(255,255,255,.12) inset,0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(21,101,192,.25);text-align:center;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:none;}}
    .card::before{content:'';position:absolute;top:0;left:16%;right:16%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);}
    .photo-wrap{position:relative;width:115px;height:115px;margin:0 auto 22px;}
    .photo-wrap::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,.7),rgba(100,181,246,.5),rgba(255,255,255,.05),rgba(255,255,255,.7));animation:spin 5s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .photo{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top center;display:block;border:3px solid rgba(255,255,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.5);}
    .name{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.3px;margin-bottom:14px;}
    .msg{font-size:15px;line-height:1.75;color:rgba(255,255,255,.75);margin-bottom:30px;}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:linear-gradient(135deg,#229ed9,#1a7fc1);color:#fff;text-decoration:none;font-size:15px;font-weight:700;padding:15px 24px;border-radius:14px;border:1px solid rgba(255,255,255,.2);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 8px 28px rgba(34,158,217,.4);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;cursor:pointer;}
    .btn::after{content:'';position:absolute;top:0;left:-75%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:sweep 2.8s ease-in-out infinite;}
    @keyframes sweep{0%{left:-75%;}60%{left:130%;}100%{left:130%;}}
    .btn:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 14px 36px rgba(34,158,217,.55);}
    .btn:active{transform:scale(.98);}
    .btn svg{width:22px;height:22px;flex-shrink:0;}
    .safe{margin-top:16px;font-size:11.5px;color:rgba(255,255,255,.3);}
